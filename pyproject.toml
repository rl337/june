[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "june"
version = "0.3.0"
description = "Application-level orchestrator that schedules goals and runs work through MechaHarness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Richard Lee", email = "rlee@tokyo3.com" },
]
keywords = ["agent", "orchestrator", "mechaharness", "scheduler", "goals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
harness = [
  "mechaharness>=0.2.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy==1.19.1",
]

[project.scripts]
june = "june.cli:app"

[project.urls]
Homepage = "https://github.com/rl337/june"
Repository = "https://github.com/rl337/june"
Issues = "https://github.com/rl337/june/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
june = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["june"]
plugins = ["pydantic.mypy"]
